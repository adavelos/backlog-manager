# Backlog Manager as a container. The database lives in the named volume "backlog-data".
# Behind the gateway, the service is reached by the name "backlog" on the gateway's network.
services:
  backlog:
    build: .
    image: backlog-manager:local
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - backlog-data:/data

volumes:
  backlog-data:
