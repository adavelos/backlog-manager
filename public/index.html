<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Backlog Manager</title>
  <link rel="icon" type="image/svg+xml" href="img/icon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header (shared partial) -->
    <header class="app-header">
      <div class="app-brand">
        <div>
          <img src="img/icon.svg" alt="Backlog Manager" width="22" height="22">
        </div>
        <div class="app-title">Backlog Manager</div>
      </div>
      <div class="app-main-nav">
        <a href="boards.html" class="nav-pill">Boards</a>
        <a href="projects.html" class="nav-pill">Projects</a>
        <a href="notes.html" class="nav-pill">Notes</a>
      </div>
      <div class="header-type-toggle" id="headerTypeToggle">
        <span class="toggle-label toggle-label-left" data-type="work">Work</span>
        <div class="toggle-track">
          <div class="toggle-knob" id="toggleKnob"></div>
        </div>
        <span class="toggle-label toggle-label-right" data-type="argonath">Argonath</span>
      </div>
    </header>

    <!-- Landing content -->
    <div class="layout" style="display:flex;align-items:center;justify-content:center;gap:24px;padding:40px;">
      <a href="boards.html" style="text-decoration:none;">
        <div style="background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:32px 40px;text-align:center;box-shadow:var(--shadow-sm);transition:all 0.2s;cursor:pointer;min-width:200px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--indigo-600)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;">
            <rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/>
            <rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>
          </svg>
          <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">Boards</div>
          <div style="font-size:12px;color:var(--text-muted);">State &amp; release boards, quick edit, archive</div>
        </div>
      </a>
      <a href="projects.html" style="text-decoration:none;">
        <div style="background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:32px 40px;text-align:center;box-shadow:var(--shadow-sm);transition:all 0.2s;cursor:pointer;min-width:200px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--emerald-600)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">Projects</div>
          <div style="font-size:12px;color:var(--text-muted);">Projects &amp; releases management</div>
        </div>
      </a>
      <a href="notes.html" style="text-decoration:none;">
        <div style="background:var(--bg-surface);border:1px solid var(--border-light);border-radius:var(--radius-lg);padding:32px 40px;text-align:center;box-shadow:var(--shadow-sm);transition:all 0.2s;cursor:pointer;min-width:200px;">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="var(--amber-600)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="margin-bottom:12px;">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
            <line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/>
          </svg>
          <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:4px;">Notes</div>
          <div style="font-size:12px;color:var(--text-muted);">Hierarchical notes with Markdown editor</div>
        </div>
      </a>
    </div>

    <!-- Status bar (shared partial) -->
    <div class="status-bar" id="statusBar">
      <div class="status-left">
        <div class="status-indicator" id="statusIndicator"></div>
        <span id="statusDataFile">Data file: (loading...)</span>
      </div>
      <div class="status-right">
        <span id="statusLastSync">Last sync: &mdash;</span>
        <button class="btn-inline" id="syncNowBtn">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"/>
            <polyline points="1 20 1 14 7 14"/>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
          </svg>
          Sync now
        </button>
      </div>
    </div>
  </div>

  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-dialog" id="modalDialog">
      <div class="modal-header" id="modalHeader"></div>
      <div class="modal-body">
        <p class="modal-message" id="modalMessage"></p>
        <input class="modal-input hidden" id="modalInput" type="text" placeholder="">
      </div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="js/common.js"></script>
</body>
</html>
