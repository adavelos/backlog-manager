<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notes &mdash; Backlog Manager</title>
  <link rel="icon" type="image/svg+xml" href="img/icon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/notes.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header (shared partial) -->
    <header class="app-header">
      <div class="app-brand">
        <div>
          <img src="img/icon.svg" alt="Backlog Manager" width="22" height="22">
        </div>
        <div class="app-title">Backlog Manager</div>
      </div>
      <div class="app-main-nav">
        <a href="boards.html" class="nav-pill">Boards</a>
        <a href="projects.html" class="nav-pill">Projects</a>
        <a href="notes.html" class="nav-pill active">Notes</a>
      </div>
      <div class="header-type-toggle" id="headerTypeToggle">
        <span class="toggle-label toggle-label-left" data-type="work">Work</span>
        <div class="toggle-track">
          <div class="toggle-knob" id="toggleKnob"></div>
        </div>
        <span class="toggle-label toggle-label-right" data-type="argonath">Argonath</span>
      </div>
    </header>

    <!-- Main layout -->
    <div class="layout">
      <!-- Notes view -->
      <div class="notes-layout">
        <div class="notes-left-pane">
          <div class="notes-tree-header">
            <span>Notes</span>

          </div>
          <div class="notes-tree" id="notesTree">
            <!-- Scratchpad entry will be inserted at top by notes.js -->
          </div>
        </div>
        <div class="notes-right-pane">
          <!-- Empty state -->
          <div class="notes-editor-empty" id="notesEditorEmpty">
            <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
              <polyline points="14 2 14 8 20 8"/>
              <line x1="16" y1="13" x2="8" y2="13"/>
              <line x1="16" y1="17" x2="8" y2="17"/>
            </svg>
            <div class="notes-editor-empty-text">Select a note to edit</div>
            <div class="notes-editor-empty-sub">Choose a note from the tree or create a new one</div>
          </div>
          <!-- Editor -->
          <div class="notes-editor-content hidden" id="notesEditorContent">
            <div class="notes-editor-header">
              <input type="text" id="noteTitleInput" class="note-title-input" placeholder="Note title">
              <span id="noteContextLabel" class="note-context-label"></span>
              <button class="btn-inline" id="saveNoteBtn">Save</button>
              <button class="btn-inline" id="deleteNoteBtn">Delete</button>
            </div>
            <div class="notes-editor-body">
              <textarea id="noteContentInput" class="note-content-input" placeholder="Write Markdown notes here..."></textarea>
              <div id="notePreview" class="note-preview"></div>
            </div>
          </div>
          <!-- Scratchpad Editor -->
          <div class="notes-scratchpad-editor hidden" id="notesScratchpadEditor">
            <div class="scratchpad-header">
              <span class="scratchpad-title">Scratchpad</span>
              <span class="scratchpad-status">Quick capture, autosaved</span>
            </div>
            <div class="scratchpad-body">
              <textarea id="scratchpadInput" class="scratchpad-input" placeholder="Jot something down..."></textarea>
            </div>
            <div class="scratchpad-footer">
              <button class="btn-inline-sm" id="scratchpadTimestampBtn">Insert timestamp</button>
              <button class="btn-inline-sm" id="scratchpadConvertBtn">Convert to note</button>
              <button class="btn-inline-sm" id="scratchpadClearBtn">Clear</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Status bar (shared partial) -->
      <div class="status-bar" id="statusBar">
        <div class="status-left">
          <div class="status-indicator" id="statusIndicator"></div>
          <span id="statusDataFile">Data file: (loading...)</span>
        </div>
        <div class="status-right"></div>
      </div>
    </div>
  </div>

  <!-- Custom modal dialog -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-dialog" id="modalDialog">
      <div class="modal-header" id="modalHeader"></div>
      <div class="modal-body">
        <p class="modal-message" id="modalMessage"></p>
        <input class="modal-input hidden" id="modalInput" type="text" placeholder="">
      </div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="js/marked.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/notes.js"></script>
</body>
</html>
