<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Boards &mdash; Backlog Manager</title>
  <link rel="icon" type="image/svg+xml" href="img/icon.svg?v=1">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/common.css">
  <link rel="stylesheet" href="css/boards.css">
</head>
<body>
  <div class="app-shell">
    <!-- Header (shared partial) -->
    <header class="app-header">
      <div class="app-brand">
        <div>
          <img src="img/icon.svg" alt="Backlog Manager" width="22" height="22">
        </div>
        <div class="app-title">Backlog Manager</div>
      </div>
      <div class="app-main-nav">
        <a href="boards.html" class="nav-pill active">Boards</a>
        <a href="projects.html" class="nav-pill">Projects</a>
        <a href="notes.html" class="nav-pill">Notes</a>
      </div>
      <div class="header-type-toggle" id="headerTypeToggle">
        <span class="toggle-label toggle-label-left" data-type="work">Work</span>
        <div class="toggle-track">
          <div class="toggle-knob" id="toggleKnob"></div>
        </div>
        <span class="toggle-label toggle-label-right" data-type="argonath">Argonath</span>
      </div>
    </header>

    <!-- Filters panel (boards-specific) -->
    <div class="filters-panel" id="filtersPanel">
      <div class="filter-row">
        <div class="filter-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
          </svg>
          <span>Projects</span>
        </div>
        <div class="chip-bar" id="projectChips"></div>
      </div>

      <div class="filter-row">
        <div class="filter-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2H2v10l9.29 9.29a2 2 0 0 0 2.83 0l6.17-6.17a2 2 0 0 0 0-2.83L12 2z"/>
            <circle cx="7" cy="7" r="1" fill="currentColor"/>
          </svg>
          <span>Tags</span>
        </div>
        <div class="chip-bar" id="tagChips"></div>
      </div>

      <div class="filter-row">
        <div class="filter-label">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <path d="M3 9h18"/>
            <path d="M9 21V9"/>
          </svg>
          <span>View</span>
        </div>
        <div class="view-selector">
          <div class="view-buttons">
            <button class="view-button active" data-view="state">State board</button>
            <button class="view-button" data-view="release">Release board</button>
          </div>
          <div class="view-buttons qe-toggle-group">
            <button class="qe-toggle-button active" id="qeModeNormal">Board</button>
            <button class="qe-toggle-button" id="qeModeQuick">Quick Edit</button>
          </div>
        </div>
        <label class="archive-toggle" id="archiveToggleLabel">
          <input type="checkbox" id="archiveToggleCheckbox">
          <span>Archive panel</span>
        </label>
      </div>
    </div>

    <!-- Main layout -->
    <div class="layout">
      <!-- Quick Edit hint -->
      <span class="qe-toggle-hint hidden" id="qeToggleHint">Double-click title to edit. Enter to commit, Tab to next row, Esc to cancel.</span>

      <!-- Boards view -->
      <div class="boards-container" id="boardsView">
        <div class="board" id="boardColumns"></div>

        <!-- Quick Edit view -->
        <div class="qe-view hidden" id="qeView"></div>

        <!-- Archive panel -->
        <div class="archive-panel hidden" id="archivePanel">
          <div class="archive-header">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="3" width="20" height="5" rx="1"/>
              <path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8"/>
              <path d="M10 12h4"/>
            </svg>
            <span>Archived DONE items (older than 7 days)</span>
          </div>
          <div class="archive-list" id="archiveList"></div>
        </div>
      </div>

      <!-- Status bar (shared partial) -->
      <div class="status-bar" id="statusBar">
        <div class="status-left">
          <div class="status-indicator" id="statusIndicator"></div>
          <span id="statusDataFile">Data file: (loading...)</span>
        </div>
        <div class="status-right"></div>
      </div>
    </div>
  </div>

  <!-- Custom modal dialog -->
  <div class="modal-overlay hidden" id="modalOverlay">
    <div class="modal-dialog" id="modalDialog">
      <div class="modal-header" id="modalHeader"></div>
      <div class="modal-body">
        <p class="modal-message" id="modalMessage"></p>
        <input class="modal-input hidden" id="modalInput" type="text" placeholder="">
      </div>
      <div class="modal-footer" id="modalFooter"></div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/common.js"></script>
  <script src="js/boards.js"></script>
</body>
</html>
