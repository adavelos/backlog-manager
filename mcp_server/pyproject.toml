[project]
name = "backlog-mcp"
version = "0.1.0"
description = "MCP server exposing the Backlog Manager REST API as agent tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "httpx>=0.27.0",
]

[project.scripts]
backlog-mcp = "backlog_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backlog_mcp"]
